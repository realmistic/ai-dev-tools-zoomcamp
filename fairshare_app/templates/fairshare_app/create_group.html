{% extends "base.html" %}

{% block title %}Create Trip - FairShare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h1 class="mb-4">Create a New Trip</h1>
        
        <form method="post" class="card p-4">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_trip_name" class="form-label">Trip Name</label>
                {{ form.trip_name }}
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Trip</button>
            <a href="{% url 'index' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
        </form>

        <div class="card mt-4 bg-light">
            <div class="card-body">
                <h6 class="card-title">Examples:</h6>
                <ul class="mb-0">
                    <li>Vegas 2026</li>
                    <li>Beach Weekend</li>
                    <li>Camping Trip</li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
